<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Music</title>

  <link rel="icon" href="covers/album-cover.jpg">

  <meta property="og:title" content="My Music">
  <meta property="og:description" content="Unreleased demos • private listening">
  <meta property="og:image" content="covers/album-cover.jpg">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter,Arial,sans-serif;
    }

    body{
      background:#000;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:50px 20px;
    }

    .container{
      width:100%;
      max-width:430px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
    }

   .cover{
  width:260px;
  height:260px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 18px 45px rgba(0,0,0,.45);
}

    h1{
      font-size:32px;
      font-weight:700;
      letter-spacing:.5px;
    }

    .subtitle{
      color:#777;
      font-size:14px;
      margin-top:-12px;
    }


    .track-card{
      width:100%;
      background:#0d0d0d;
      border:1px solid #1c1c1c;
      border-radius:18px;
      padding:20px;
      transition:.25s ease;
    }


    .track-card:hover{
      transform:translateY(-5px);
      border-color:#444;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }


    .track-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
      font-size:17px;
      font-weight:600;
    }


    .track-title span{
      color:#888;
      font-size:13px;
      font-weight:400;
    }


    audio{
      width:100%;
      border-radius:12px;
    }


    .links{
      margin-top:10px;
      display:flex;
      gap:25px;
      flex-wrap:wrap;
      justify-content:center;
      padding-bottom:30px;
    }


    .links a{
      color:#888;
      text-decoration:none;
      font-size:14px;
      transition:.2s;
    }


    .links a:hover{
      color:white;
    }


    @media(max-width:500px){

      .cover{
        width:220px;
        height:220px;
      }

      h1{
        font-size:28px;
      }

    }

  </style>

</head>


<body>


<div class="container">


<img src="covers/album-cover.jpg" class="cover" alt="Album Cover">


<h1>My Music</h1>


<p class="subtitle">
unreleased demos • private listening
</p>



<div class="track-card">

<div class="track-title">
demo 2
<span></span>
</div>

<audio controls>
<source src="songs/demo 2.mp3" type="audio/mpeg">
Your browser doesn't support audio.
</audio>

</div>




<div class="track-card">

<div class="track-title">
sad song
<span></span>
</div>

<audio controls>
<source src="songs/New_Project (10).mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
ukulele demo
<span></span>
</div>

<audio controls>
<source src="songs/ukelele.mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
guitar demo
<span></span>
</div>

<audio controls>
<source src="songs/New_Project (12).mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
demo 14/6/26
<span></span>
</div>

<audio controls>
<source src="songs/root rock crunch.mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
demo 27/6/26
<span></span>
</div>

<audio controls>
<source src="songs/supernova demo2.mp3" type="audio/mpeg">
</audio>

</div>







</div>



<script>

const players=document.querySelectorAll("audio");

players.forEach(player=>{

    player.addEventListener("play",()=>{

        players.forEach(other=>{

            if(other!==player){
                other.pause();
            }

        });

    });

});

</script>


</body>
</html>
