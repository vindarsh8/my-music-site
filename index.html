<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music</title>

<link rel="icon" href="covers/album-cover.jpg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
    min-height:100vh;
}

#lockscreen{
    position:fixed;
    inset:0;
    background:#0a0a0a;
    display:flex;
    justify-content:center;
    align-items:center;
}

.lock-box{
    width:320px;
    background:#141414;
    border:1px solid #222;
    border-radius:18px;
    padding:30px;
    text-align:center;
}

.lock-box h2{
    margin-bottom:10px;
}

.lock-box p{
    color:#888;
    margin-bottom:20px;
}

.lock-box input{
    width:100%;
    padding:14px;
    font-size:22px;
    text-align:center;
    border:none;
    outline:none;
    border-radius:10px;
    background:#222;
    color:white;
    letter-spacing:6px;
}

.lock-box button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    font-weight:600;
    cursor:pointer;
}

.error{
    color:#ff6666;
    margin-top:15px;
    display:none;
}

#content{
    display:none;
}

.container{
    width:100%;
    max-width:430px;
    margin:50px auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 20px;
}

.cover{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 18px 45px rgba(0,0,0,.45);
}

h1{
    font-size:32px;
}

.subtitle{
    color:#999;
    font-size:14px;
}

.track-card{
    width:100%;
    background:#141414;
    border:1px solid #222;
    border-radius:18px;
    padding:20px;
    transition:.25s;
}

.track-card:hover{
    transform:translateY(-4px);
    border-color:#444;
}

.track-title{
    font-size:17px;
    font-weight:600;
    margin-bottom:15px;
}

audio{
    width:100%;
}
</style>
</head>

<body>

<div id="lockscreen">
    <div class="lock-box">
        <h2>Private Listening</h2>
        <p>Enter the 4-digit PIN</p>

        <input
            type="password"
            maxlength="4"
            id="pin"
            inputmode="numeric"
            placeholder="••••">

        <button onclick="unlock()">Unlock</button>

        <div class="error" id="error">
            Incorrect PIN
        </div>
    </div>
</div>

<div id="content">

<div class="container">

<img src="covers/album-cover.jpg" class="cover">

<h1>My Music</h1>

<p class="subtitle">unreleased demos • private listening</p>

<div class="track-card">
<div class="track-title">demo 2</div>
<audio controls>
<source src="songs/demo 2.mp3">
</audio>
</div>

<div class="track-card">
<div class="track-title">sad song</div>
<audio controls>
<source src="songs/New_Project (10).mp3">
</audio>
</div>

<div class="track-card">
<div class="track-title">ukulele demo</div>
<audio controls>
<source src="songs/ukelele.mp3">
</audio>
</div>

<div class="track-card">
<div class="track-title">guitar demo</div>
<audio controls>
<source src="songs/New_Project (12).mp3">
</audio>
</div>

<div class="track-card">
<div class="track-title">demo 14/6/26</div>
<audio controls>
<source src="songs/root rock crunch.mp3">
</audio>
</div>

<div class="track-card">
<div class="track-title">demo 27/6/26</div>
<audio controls>
<source src="songs/supernova demo2.mp3">
</audio>
</div>

</div>

</div>

<script>
// CHANGE THIS TO YOUR OWN 4-DIGIT PIN
const PASSWORD = "1234";

function unlock(){
    const pin=document.getElementById("pin").value;

    if(pin===PASSWORD){
        document.getElementById("lockscreen").style.display="none";
        document.getElementById("content").style.display="block";
    }else{
        document.getElementById("error").style.display="block";
        document.getElementById("pin").value="";
    }
}

document.getElementById("pin").addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        unlock();
    }
});

const players=document.querySelectorAll("audio");

players.forEach(player=>{
    player.addEventListener("play",()=>{
        players.forEach(other=>{
            if(other!==player){
                other.pause();
            }
        });
    });
});
</script>

</body>
</html>
