<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Music</title>

  <link rel="icon" href="covers/album-cover.jpg">

  <meta property="og:title" content="My Music">
  <meta property="og:description" content="Unreleased demos • private listening">
  <meta property="og:image" content="covers/album-cover.jpg">

  <style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Tahoma", "MS Sans Serif", Arial, sans-serif;
}


body{
  background:#008080;
  color:#000;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}


.container{
  width:100%;
  max-width:430px;
  background:#c0c0c0;
  border:3px solid #000;
  padding:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;

  box-shadow:
  6px 6px 0 black;
}


/* Windows 98 title bar */

.container:before{

  content:"My Music - Windows 98";

  display:block;
  width:100%;

  background:#000080;
  color:white;

  padding:5px;

  font-weight:bold;
  font-size:14px;

}



.cover{

  width:260px;
  height:260px;

  object-fit:cover;

  border-radius:0;

  border:3px solid black;

}



h1{

  font-size:30px;

}



.subtitle{

  font-size:13px;

  color:#333;

  margin-top:-10px;

}



.track-card{

  width:100%;

  background:#c0c0c0;

  padding:15px;


  border-top:3px solid white;
  border-left:3px solid white;

  border-right:3px solid #555;
  border-bottom:3px solid #555;

}



.track-title{

  font-size:16px;

  font-weight:bold;

  margin-bottom:10px;

}



audio{

  width:100%;

}



.links{

  display:flex;

  gap:20px;

}



.links a{

  color:#000080;

  text-decoration:underline;

  font-size:14px;

}



.links a:hover{

  color:red;

}



@media(max-width:500px){

.cover{

width:220px;
height:220px;

}

}

</style>
</head>


<body>


<div class="container">


<img src="covers/album-cover.jpg" class="cover" alt="Album Cover">


<h1>My Music</h1>


<p class="subtitle">
unreleased demos • private listening
</p>



<div class="track-card">

<div class="track-title">
demo 2
<span></span>
</div>

<audio controls>
<source src="songs/demo 2.mp3" type="audio/mpeg">
Your browser doesn't support audio.
</audio>

</div>




<div class="track-card">

<div class="track-title">
sad song
<span></span>
</div>

<audio controls>
<source src="songs/New_Project (10).mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
ukulele demo
<span></span>
</div>

<audio controls>
<source src="songs/ukelele.mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
guitar demo
<span></span>
</div>

<audio controls>
<source src="songs/New_Project (12).mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
demo 14/6/26
<span></span>
</div>

<audio controls>
<source src="songs/root rock crunch.mp3" type="audio/mpeg">
</audio>

</div>




<div class="track-card">

<div class="track-title">
demo 27/6/26
<span></span>
</div>

<audio controls>
<source src="songs/supernova demo2.mp3" type="audio/mpeg">
</audio>

</div>







</div>



<script>

const players=document.querySelectorAll("audio");

players.forEach(player=>{

    player.addEventListener("play",()=>{

        players.forEach(other=>{

            if(other!==player){
                other.pause();
            }

        });

    });

});

</script>


</body>
</html>
