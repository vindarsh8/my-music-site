<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Music</title>

<link rel="icon" href="covers/playlist-cover.png">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- LOCK SCREEN -->

<div id="lockscreen">

<div class="background"></div>

<div class="lockBox">

<div class="lockIcon">

🔒

</div>

<h1>Private Listening</h1>

<p>Enter Passcode</p>

<div id="dots">

<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>

</div>

<div id="wrong">

Incorrect Passcode

</div>

<input
id="pin"
type="password"
maxlength="4"
inputmode="numeric"
autocomplete="off">

</div>

</div>



<!-- MUSIC PAGE -->

<div id="page">

<header>

<div class="cover">

<img
src="covers/playlist-cover.png"
alt="Playlist">

</div>

<h2>My Music</h2>

<p>Private listening • Unreleased demos</p>

</header>



<section id="songs">

<div class="song">

<h3>demo 2</h3>

<audio controls>

<source
src="songs/demo 2.mp3"
type="audio/mpeg">

</audio>

</div>



<div class="song">

<h3>sad song</h3>

<audio controls>

<source
src="songs/New_Project (10).mp3"
type="audio/mpeg">

</audio>

</div>



<div class="song">

<h3>ukulele demo</h3>

<audio controls>

<source
src="songs/ukelele.mp3"
type="audio/mpeg">

</audio>

</div>



<div class="song">

<h3>guitar demo</h3>

<audio controls>

<source
src="songs/New_Project (12).mp3"
type="audio/mpeg">

</audio>

</div>



<div class="song">

<h3>demo 14/6/26</h3>

<audio controls>

<source
src="songs/root rock crunch.mp3"
type="audio/mpeg">

</audio>

</div>



<div class="song">

<h3>demo 27/6/26</h3>

<audio controls>

<source
src="songs/supernova demo2.mp3"
type="audio/mpeg">

</audio>

</div>

</section>

</div>

<script src="script.js"></script>

</body>

</html>
