<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Untitled</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="covers/vinyl.png">

</head>

<body>

<!-- ===========================
LOCK SCREEN
=========================== -->

<div id="lockscreen">

<div class="lock-content">

<h1>Private Listening</h1>

<p>Enter Passcode</p>

<div id="dots">

<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>

</div>

<div id="error">

Incorrect Passcode

</div>

<input
id="pin"
type="password"
maxlength="4"
inputmode="numeric"
autocomplete="off">

</div>

</div>

<!-- ===========================
APP
=========================== -->

<div id="app">

<header>

<div class="vinyl-wrapper">

<div id="vinyl">

<div class="groove g1"></div>
<div class="groove g2"></div>
<div class="groove g3"></div>
<div class="groove g4"></div>

<div class="centre"></div>

</div>

</div>

<h1>Untitled</h1>

<p>Private Listening</p>

</header>

<section id="songs">

<div class="song"
data-title="demo 2"
data-src="songs/demo 2.mp3">

<div>

<h3>demo 2</h3>

<p>Demo</p>

</div>

<div class="eq"><span></span><span></span><span></span></div>

</div>

<div class="song"
data-title="sad song"
data-src="songs/New_Project (10).mp3">

<div>

<h3>sad song</h3>

<p>Demo</p>

</div>

<div class="eq"><span></span><span></span><span></span></div>

</div>

<div class="song"
data-title="ukulele demo"
data-src="songs/ukelele.mp3">

<div>

<h3>ukulele demo</h3>

<p>Demo</p>

</div>

<div class="eq"><span></span><span></span><span></span></div>

</div>

<div class="song"
data-title="guitar demo"
data-src="songs/New_Project (12).mp3">

<div>

<h3>guitar demo</h3>

<p>Demo</p>

</div>

<div class="eq"><span></span><span></span><span></span></div>

</div>

<div class="song"
data-title="demo 14/6/26"
data-src="songs/root rock crunch.mp3">

<div>

<h3>demo 14/6/26</h3>

<p>Demo</p>

</div>

<div class="eq"><span></span><span></span><span></span></div>

</div>

<div class="song"
data-title="demo 27/6/26"
data-src="songs/supernova demo2.mp3">

<div>

<h3>demo 27/6/26</h3>

<p>Demo</p>

</div>

<div class="eq"><span></span><span></span><span></span></div>

</div>

</section>
<!-- ===========================
BOTTOM PLAYER
=========================== -->

<footer id="player">

    <div id="playerTop">

        <div id="miniVinyl">

            <div class="miniCentre"></div>

        </div>

        <div id="songInfo">

            <h2 id="currentTitle">
                Select a song
            </h2>

            <p>
                Private Listening
            </p>

        </div>

    </div>

    <div id="controls">

        <button id="prev" aria-label="Previous Song">

            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M6 5h2v14H6zm3 7 9 7V5z"/>
            </svg>

        </button>

        <button id="play" aria-label="Play">

            <svg id="playIcon" viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>

        </button>

        <button id="next" aria-label="Next Song">

            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M16 5h2v14h-2zM7 5v14l9-7z"/>
            </svg>

        </button>

    </div>

    <div id="progressArea">

        <span id="currentTime">

            0:00

        </span>

        <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100">

        <span id="duration">

            0:00

        </span>

    </div>

</footer>

<audio id="audio"></audio>

</div>

<script src="script.js"></script>

</body>
</html>
