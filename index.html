<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<link rel="icon" href="covers/album-cover.jpg">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Verdana,Arial,sans-serif;
}

body{
background:#1f3d5b;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:32px 32px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px 20px;
color:#111;
overflow-x:hidden;
}

#lockscreen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#1f3d5b;
z-index:9999;
}

.login-window{
width:360px;
background:#c0c0c0;
border:2px solid;
border-color:white #404040 #404040 white;
box-shadow:8px 8px black;
border-radius:12px;
overflow:hidden;
}

.titlebar{
background:linear-gradient(to right,#000080,#2677d8);
color:white;
padding:8px 10px;
font-weight:bold;
font-size:14px;
}

.login-content{
padding:30px;
text-align:center;
}

.login-content h2{
margin-bottom:12px;
font-size:24px;
}

.login-content p{
margin-bottom:15px;
font-size:14px;
}

#pin{
width:130px;
padding:10px;
font-size:22px;
letter-spacing:8px;
text-align:center;
border:2px inset white;
margin-bottom:18px;
outline:none;
background:white;
}

button{
padding:9px 26px;
background:#c0c0c0;
border:2px solid;
border-color:white #404040 #404040 white;
cursor:pointer;
font-weight:bold;
border-radius:8px;
}

button:active{
border-color:#404040 white white #404040;
}

#error{
height:20px;
margin-top:15px;
color:#a00000;
font-size:14px;
}

.container{
display:none;
width:100%;
max-width:460px;
background:#d4d0c8;
border:2px solid;
border-color:white #404040 #404040 white;
box-shadow:10px 10px black;
border-radius:18px;
overflow:hidden;
}

.windowbar{
background:linear-gradient(to right,#000080,#1e6ad6);
color:white;
padding:8px 10px;
font-weight:bold;
font-size:14px;
display:flex;
justify-content:space-between;
align-items:center;
}

.window-buttons{
display:flex;
gap:4px;
}

.window-buttons span{
width:18px;
height:18px;
background:#c0c0c0;
border:1px solid #333;
display:flex;
align-items:center;
justify-content:center;
color:black;
font-size:11px;
}

.content{
padding:24px;
}

.cover{
width:260px;
height:260px;
display:block;
margin:auto;
border-radius:50%;
border:8px solid #222;
object-fit:cover;
animation:spin 14s linear infinite;
animation-play-state:paused;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.cover.playing{
animation-play-state:running;
}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

h1{
text-align:center;
margin-top:20px;
font-size:30px;
}

.subtitle{
text-align:center;
font-size:13px;
margin-top:6px;
margin-bottom:22px;
color:#444;
}

.track-card{
background:#efefef;
padding:16px;
border-radius:12px;
margin-bottom:16px;
border:2px solid;
border-color:white #666 #666 white;
}

.track-title{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-bottom:12px;
font-size:15px;
}

audio{
width:100%;
}

.links{
display:flex;
justify-content:center;
gap:18px;
margin-top:20px;
}

.links a{
color:#000080;
font-size:14px;
}

.links a:hover{
color:red;
}

@media(max-width:500px){

.cover{
width:220px;
height:220px;
}

.container{
max-width:100%;
}

}

</style>

</head>

<body>

<div id="lockscreen">

<div class="login-window">

<div class="titlebar">
My Music.exe
</div>

<div class="login-content">

<h2>PRIVATE DEMOS</h2>

<p>Enter Access Code</p>

<input
id="pin"
type="password"
maxlength="4"
placeholder="••••">

<br>

<button onclick="unlock()">
OK
</button>

<p id="error"></p>

</div>

</div>

</div>

<div class="container" id="site">

<div class="windowbar">

<span>My Music</span>

<div class="window-buttons">

<span>_</span>
<span>□</span>
<span>✕</span>

</div>

</div>

<div class="content">

<img
src="covers/album-cover.jpg"
class="cover"
id="cover">

<h1>My Music</h1>

<p class="subtitle">
unreleased demos • private listening
</p>

<div class="track-card">

<div class="track-title">
demo 2
</div>

<audio controls>

<source
src="songs/demo 2.mp3"
type="audio/mpeg">

</audio>

</div>

<div class="track-card">

<div class="track-title">
sad song
</div>

<audio controls>

<source
src="songs/New_Project (10).mp3"
type="audio/mpeg">

</audio>

</div>

<div class="track-card">

<div class="track-title">
ukulele demo
</div>

<audio controls>

<source
src="songs/ukelele.mp3"
type="audio/mpeg">

</audio>

</div>
<div class="track-card">

<div class="track-title">
guitar demo
</div>

<audio controls>

<source
src="songs/New_Project (12).mp3"
type="audio/mpeg">

</audio>

</div>

<div class="track-card">

<div class="track-title">
demo 14/6/26
</div>

<audio controls>

<source
src="songs/root rock crunch.mp3"
type="audio/mpeg">

</audio>

</div>

<div class="track-card">

<div class="track-title">
demo 27/6/26
</div>

<audio controls>

<source
src="songs/supernova demo2.mp3"
type="audio/mpeg">

</audio>

</div>

<div class="links">

<a href="#">
instagram
</a>

<a href="#">
spotify
</a>

<a href="#">
youtube
</a>

</div>

</div>

</div>

<script>

const players = document.querySelectorAll("audio");

const cover = document.getElementById("cover");

players.forEach(player=>{

player.addEventListener("play",()=>{

players.forEach(other=>{

if(other!==player){

other.pause();

}

});

cover.classList.add("playing");

});

player.addEventListener("pause",()=>{

const stillPlaying=[...players].some(audio=>!audio.paused);

if(!stillPlaying){

cover.classList.remove("playing");

}

});

player.addEventListener("ended",()=>{

const stillPlaying=[...players].some(audio=>!audio.paused);

if(!stillPlaying){

cover.classList.remove("playing");

}

});

});

function unlock(){

const pin=document.getElementById("pin").value;

if(pin==="0000"){

document.getElementById("lockscreen").style.display="none";

document.getElementById("site").style.display="block";

}else{

document.getElementById("error").textContent="Incorrect access code.";

document.getElementById("pin").value="";

}

}

document.getElementById("pin").addEventListener("keydown",function(e){

if(e.key==="Enter"){

unlock();

}

});
cover.classList.remove("playing");

}

});

</script>

</body>

</html>
