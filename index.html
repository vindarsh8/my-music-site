<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Music</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .cover {
      width: 100%;
      max-width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9a9a9a;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .track-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 22px;
      text-align: left;
    }

    .track-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    audio {
      width: 100%;
      border-radius: 12px;
    }

    .links {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .links a {
      color: #bdbdbd;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .links a:hover {
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="covers/album-cover.jpg" alt="Album Cover" class="cover" />

    <h1>My Music</h1>
    <p class="subtitle">unreleased demos • private listening</p>

    <div class="track-card">
      <div class="track-title">demo 2</div>
      <audio controls>
        <source src="songs/demo 2.mp3" type="audio/mpeg" />
        Your browser does not support the audio player.
      </audio>
    </div>

    <div class="track-card">
      <div class="track-title">roshan</div>
      <audio controls>
        <source src="songs/roshan (1).mp3" type="audio/mpeg" />
        Your browser does not support the audio player.
      </audio>
    </div>

     <div class="track-card">
      <div class="track-title">sad song</div>
      <audio controls>
        <source src="songs/New_Project (10).mp3" type="audio/mpeg" />
        Your browser does not support the audio player.
      </audio>
    </div>

      <div class="track-card">
      <div class="track-title">ukelele demo</div>
      <audio controls>
        <source src="songs/ukelele.mp3" type="audio/mpeg" />
        Your browser does not support the audio player.
      </audio>
    </div>
   

    <div class="track-card">
      <div class="track-title">guitar demo</div>
      <audio controls>
        <source src="songs/New_Project (12).mp3" type="audio/mpeg" />
        Your browser does not support the audio player.
      </audio>
    </div>
    
     <div class="track-card">
      <div class="track-title">demo 14/6/26o</div>
      <audio controls>
        <source src="songs/root rock crunch.mp3" type="audio/mpeg" />
        Your browser does not support the audio player.
      </audio>
    </div>
    
    <div class="links">
      <a href="#">Instagram</a>
      <a href="#">Spotify</a>
      <a href="#">YouTube</a>
    </div>
  </div>
</body>
</html>
